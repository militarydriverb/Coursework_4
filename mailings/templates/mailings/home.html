<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная - Система рассылок</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 40px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-card h2 {
            color: #667eea;
            font-size: 1.2rem;
            margin-bottom: 15px;
        }

        .stat-value {
            font-size: 3rem;
            font-weight: bold;
            color: #764ba2;
        }

        .admin-link {
            display: block;
            text-align: center;
            margin-top: 30px;
        }

        .admin-link a {
            background: white;
            color: #667eea;
            padding: 15px 40px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            display: inline-block;
        }

        .admin-link a:hover {
            background: #667eea;
            color: white;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Система управления рассылками</h1>

        <div class="stats-grid">
            <div class="stat-card">
                <h2>Всего рассылок</h2>
                <div class="stat-value">{{ total_mailings }}</div>
            </div>

            <div class="stat-card">
                <h2>Активных рассылок</h2>
                <div class="stat-value">{{ active_mailings }}</div>
            </div>

            <div class="stat-card">
                <h2>Уникальных получателей</h2>
                <div class="stat-value">{{ unique_recipients }}</div>
            </div>
        </div>

        <div class="admin-link">
            {% if user.is_authenticated %}
                <a href="{% url 'mailings:statistics' %}">Моя статистика</a>
                <a href="/admin/">Панель администратора</a>
                <a href="{% url 'users:logout' %}">Выход ({{ user.email }})</a>
            {% else %}
                <a href="{% url 'users:login' %}">Вход</a>
                <a href="{% url 'users:register' %}">Регистрация</a>
            {% endif %}
        </div>
    </div>
</body>
</html>
