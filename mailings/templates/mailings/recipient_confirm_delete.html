{% extends 'mailings/base.html' %}

{% block title %}Удалить клиента{% endblock %}
{% block page_title %}Удалить клиента{% endblock %}

{% block content %}
<div style="background: #fff3cd; padding: 20px; border-radius: 5px; border: 1px solid #ffeaa7;">
    <h3>Вы уверены, что хотите удалить клиента?</h3>
    <p style="margin: 15px 0;"><strong>Ф.И.О.:</strong> {{ recipient.full_name }}</p>
    <p><strong>Email:</strong> {{ recipient.email }}</p>
</div>

<form method="post" style="margin-top: 20px;">
    {% csrf_token %}
    <div class="actions">
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'mailings:recipient_list' %}" class="btn btn-secondary">Отмена</a>
    </div>
</form>
{% endblock %}
